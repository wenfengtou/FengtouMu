[package]
name = "esp32-ide"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "esp32_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 主程序：Tauri 桌面应用（不含 QEMU）
[[bin]]
name = "esp32-ide"
path = "src/main.rs"

# 仿真子进程：每次运行独占加载 libqemu-xtensa.dll，独立进程便于重试/重复运行
[[bin]]
name = "esp32-sim"
path = "src/bin/sim_worker.rs"

# 协议级测试用的"假 worker"（不加载 DLL，仅配合 tests/worker_protocol.rs，不打包发布）
[[bin]]
name = "fm-fake-worker"
path = "src/bin/fake_worker.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
# 工程互导：读写 Wokwi 兼容 zip
zip = { version = "2", default-features = false, features = ["deflate"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
